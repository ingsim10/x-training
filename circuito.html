<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121418">
<title>Circuito</title>
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #F2F2EF;
    --card: #FFFFFF;
    --ink: #15171B;
    --muted: #5E646C;
    --line: #DADCD8;
    --accent: #D9480F;
    --accent-soft: #FCE3D6;
    --ok: #1F7A4F;
    --ok-soft: #DDF2E7;
    --ok-ink: #FFFFFF;
    --btn: #15171B;
    --btn-ink: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418;
      --card: #1C1F24;
      --ink: #F1F2F4;
      --muted: #9AA1AA;
      --line: #2C3038;
      --accent: #FF6A2C;
      --accent-soft: #3A2217;
      --ok: #4BC48B;
      --ok-soft: #15321F;
      --ok-ink: #0B1F14;
      --btn: #F1F2F4;
      --btn-ink: #121418;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: Verdana, Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; }

  .app { max-width: 560px; margin: 0 auto; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); }
  .schermo { display: flex; flex-direction: column; gap: 14px; min-height: calc(100dvh - 28px - env(safe-area-inset-bottom)); }
  .barra { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
  .barra .destra { display: flex; gap: 8px; }
  h1 { font-size: 20px; margin: 0; }
  h1 b { color: var(--accent); }
  h2 { font-size: 24px; margin: 0; }
  .muto { color: var(--muted); font-size: 15px; margin: 0; }
  .pulsante { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 14px;
              font-size: 15px; font-weight: bold; min-height: 44px; white-space: nowrap; }
  .link { background: none; border: 0; padding: 12px 8px; color: var(--accent); font-size: 16px; font-weight: bold; }
  .grande { width: 100%; border: 0; border-radius: 18px; padding: 18px; font-size: 26px; font-weight: bold;
            background: var(--btn); color: var(--btn-ink); min-height: 80px; }
  .grande.ok { background: var(--ok); color: var(--ok-ink); min-height: 24vh; font-size: 40px; }
  .grande.secondo { background: var(--card); color: var(--ink); border: 2px solid var(--line); }
  #riprendi { font-size: 20px; }

  .blocco { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .blocco h3 { font-size: 15px; margin: 0; color: var(--accent); text-transform: uppercase; letter-spacing: .03em; }
  .blocco p { font-size: 14px; margin: 2px 0 8px; color: var(--muted); }
  .blocco ol { margin: 0; padding-left: 22px; }
  .blocco li { padding: 3px 0; font-size: 16px; }
  .blocco li span { color: var(--muted); font-size: 14px; }

  .progresso { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .progresso div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .chip { align-self: flex-start; background: var(--accent-soft); color: var(--accent); border-radius: 999px;
          padding: 6px 14px; font-size: 16px; font-weight: bold; letter-spacing: .04em; }
  .centro { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; text-align: center; }
  .nome { font-size: 34px; font-weight: bold; line-height: 1.15; overflow-wrap: anywhere; }
  .quanto { font-size: 44px; font-weight: bold; color: var(--accent); line-height: 1.1; }
  .peso { font-size: 20px; font-weight: bold; }
  .dettaglio { font-size: 16px; color: var(--muted); line-height: 1.4; }
  .poi { font-size: 16px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; margin-top: 6px; }
  .tempo { font-size: 96px; font-weight: bold; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: .02em; }
  .recupero .tempo { font-size: 120px; color: var(--ok); }
  .etichetta { font-size: 22px; font-weight: bold; color: var(--ok); letter-spacing: .06em; }
  .prossimo { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; font-size: 22px; }
  .prossimo small { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  .prossimo b { color: var(--accent); }
  .pausa-avviso { text-align: center; font-size: 22px; font-weight: bold; color: var(--accent); }
  .fondo { display: flex; flex-direction: column; gap: 6px; }
  .riga-link { display: flex; justify-content: space-between; }
  .avviso { margin: 0; background: var(--card); border: 2px solid var(--accent); border-radius: 12px;
            padding: 12px 14px; font-size: 16px; line-height: 1.45; }
  .avviso { white-space: pre-line; }
  .avviso.bene { border-color: var(--ok); }

  /* ripetizioni e peso della serie (30/09) */
  .registra { display: grid; grid-template-columns: 1.3fr 1fr; gap: 8px; text-align: left; }
  .campo { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; }
  .etichetta-campo { font-size: 14px; color: var(--muted); font-weight: bold; margin-bottom: 4px; }
  .riga-campo { display: flex; align-items: center; gap: 6px; }
  .tondo { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--line);
           background: var(--bg); font-size: 26px; font-weight: bold; line-height: 1; padding: 0; }
  .numero { width: 100%; min-width: 0; height: 48px; border: 2px solid var(--line); border-radius: 10px;
            background: var(--bg); color: var(--ink); font: bold 28px Verdana, Tahoma, sans-serif;
            text-align: center; padding: 0 4px; }
  .numero:focus { outline: none; border-color: var(--accent); }
  .unita { font-size: 16px; color: var(--muted); font-weight: bold; }
  .riga-serie { display: flex; justify-content: center; gap: 18px; }
  .riepilogo { margin: 0; padding-left: 20px; }
  .riepilogo li { padding: 4px 0; font-size: 16px; line-height: 1.35; }
  .riepilogo b { color: var(--accent); }
  .bollino-prova { background: #FFE08A; color: #3D2E00; border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: bold; text-align: center; }
</style>
</head>
<body>
<div class="app">
  <div id="bollinoProva" class="bollino-prova" hidden>MODALITÀ PROVA · tempi ×10 più veloci</div>

  <!-- nessun allenamento nel link -->
  <section id="scVuoto" class="schermo" hidden>
    <div class="barra"><h1>X Training · <b>Circuito</b></h1></div>
    <div class="centro">
      <p class="nome">Nessun allenamento</p>
      <p class="dettaglio">Si apre dal pulsante <b>▶️ Avvia</b> nel promemoria dell'allenamento di F.R.I.D.A.Y.</p>
    </div>
  </section>

  <!-- anteprima -->
  <section id="scInizio" class="schermo" hidden>
    <div class="barra">
      <h1>X Training · <b class="modo">Circuito</b></h1>
      <button id="voce1" class="pulsante" type="button"></button>
    </div>
    <div>
      <h2 id="titolo"></h2>
      <p id="durata" class="muto"></p>
    </div>
    <div id="blocchi" class="fondo"></div>
    <p id="giaMandato" class="avviso bene" hidden></p>
    <button id="provaVoce" class="pulsante" type="button">🔊 Prova la voce</button>
    <p id="esitoVoce" class="avviso" hidden></p>
    <div class="fondo">
      <button id="riprendi" class="grande" type="button" hidden></button>
      <button id="via" class="grande" type="button">▶️ Via</button>
    </div>
  </section>

  <!-- durante -->
  <section id="scGiro" class="schermo" hidden>
    <div class="barra">
      <strong id="contatore"></strong>
      <div class="destra">
        <button id="voce2" class="pulsante" type="button"></button>
        <button id="pausa" class="pulsante" type="button">⏸ Pausa</button>
      </div>
    </div>
    <div class="progresso"><div id="barraProgresso"></div></div>
    <div id="chip" class="chip"></div>

    <div id="vistaEs" class="centro">
      <div id="esNome" class="nome"></div>
      <div id="esQuanto" class="quanto"></div>
      <div id="esPeso" class="peso" hidden></div>
      <div id="esTempo" class="tempo"></div>
      <div id="esDettaglio" class="dettaglio"></div>
      <div id="registra" class="registra" hidden>
        <div class="campo">
          <div id="rEtichetta" class="etichetta-campo">Ripetizioni</div>
          <div class="riga-campo">
            <button id="rMeno" class="tondo" type="button" aria-label="Una in meno">−</button>
            <input id="rValore" class="numero" type="text" inputmode="numeric" autocomplete="off" aria-labelledby="rEtichetta">
            <button id="rPiu" class="tondo" type="button" aria-label="Una in più">+</button>
          </div>
        </div>
        <div class="campo">
          <div id="kgEtichetta" class="etichetta-campo">Peso</div>
          <div class="riga-campo">
            <input id="kgValore" class="numero" type="text" inputmode="decimal" placeholder="—" autocomplete="off" aria-labelledby="kgEtichetta">
            <span class="unita">kg</span>
          </div>
        </div>
      </div>
      <div id="rigaSerie" class="riga-serie" hidden>
        <button id="piuSerie" class="link" type="button">＋ 1 serie</button>
        <button id="ultimaSerie" class="link" type="button">Questa è l'ultima</button>
      </div>
      <div id="esPoi" class="poi" hidden></div>
    </div>

    <div id="vistaRec" class="centro recupero">
      <div class="etichetta">RECUPERO</div>
      <div id="recTempo" class="tempo"></div>
      <div class="prossimo"><small>Prossimo</small><span id="recProssimo"></span></div>
    </div>

    <div id="avvisoPausa" class="pausa-avviso" hidden>In pausa</div>
    <div class="fondo">
      <button id="fatto" class="grande ok" type="button">✅ Fatto</button>
      <button id="salta" class="grande secondo" type="button">Salta il recupero ⏭</button>
      <div class="riga-link">
        <button id="indietro" class="link" type="button">↩ Indietro</button>
        <button id="termina" class="link" type="button">Termina</button>
      </div>
    </div>
  </section>

  <!-- fine -->
  <section id="scFine" class="schermo" hidden>
    <div class="barra"><h1>X Training · <b class="modo">Circuito</b></h1></div>
    <div class="centro">
      <div class="nome">Finito! 💪</div>
      <div id="fineTempo" class="quanto"></div>
      <div id="fineTitolo" class="dettaglio"></div>
    </div>
    <div id="fineRiepilogo" class="blocco" hidden></div>
    <p id="esitoManda" class="avviso" hidden></p>
    <button id="manda" class="grande" type="button">📤 Manda a F.R.I.D.A.Y</button>
    <button id="daCapo" class="link" type="button">Rifai da capo</button>
  </section>
</div>

<script>
(async () => {
  'use strict';
  // L'allenamento arriva nel link, dopo il "#": lo scrive F.R.I.D.A.Y (allenamento.link_circuito)
  // come JSON in base64. {t: titolo, k: chiave della sessione, m: dove si è, b: blocchi};
  // un blocco è {g: giri, r: recupero tra esercizi, rg: recupero tra giri e dopo il blocco (secondi),
  //  e: [[testo, quanto, secondi se a tempo (0 = a ripetizioni), serie, kg dell'ultima volta o null]]}.
  // m (Simone, 27/09: i circuiti solo a casa, in palestra non può sudare troppo):
  //   "lezione" = mentre lavora: serie una dopo l'altra, niente timer, il recupero lo decide la lezione;
  //   "serie"   = fuori casa ma libero: serie classiche col recupero a tempo;
  //   niente    = a casa: circuiti.
  // Fuori casa la voce parte spenta (c'è gente); si accende col tasto e se lo ricorda.
  // Con ?prova nell'indirizzo i tempi vanno 10 volte più veloci.
  //
  // Serie per serie (Simone, 30/09: "devo poter riferire più facilmente i pesi e le ripetizioni"):
  // ogni serie mostra ripetizioni (quelle della scheda) e peso (quello di prima, se no l'ultima
  // volta) già scritti; se è andata così basta Fatto, se no si corregge. "+ 1 serie" e "Questa è
  // l'ultima" cambiano il numero delle serie (solo nelle serie classiche, non nei circuiti a giri).
  // Alla fine "Manda a F.R.I.D.A.Y" spedisce tutto alla casella del server (assistente-personale/
  // casella.py), che salva, segna la sessione fatta come il ✅ e risponde su Telegram. Il link
  // porta la firma del bot (f): senza, la casella non accetta. Con ?prova la casella risponde e
  // basta: niente salvato, niente messaggio.
  const CASELLA = 'https://lezioni.qrconnect.it/friday/serie';
  const PROVA = new URLSearchParams(location.search).has('prova');
  const VEL = PROVA ? 0.1 : 1;
  const K_STATO = PROVA ? 'circuito-prova-stato' : 'circuito-stato';
  const $ = id => document.getElementById(id);
  $('bollinoProva').hidden = !PROVA;

  // ================= L'ALLENAMENTO =================
  // Dal 30/09 il bot lo manda compresso (una "z" davanti): col test del salto il link del sabato
  // arrivava a 1.363 caratteri, troppi per stare tranquilli con Telegram.
  async function leggiCircuito() {
    let s = location.hash.slice(1);
    const compresso = s.startsWith('z');
    s = (compresso ? s.slice(1) : s).replace(/-/g, '+').replace(/_/g, '/');
    if (!s) return null;
    while (s.length % 4) s += '=';
    try {
      let bytes = Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
      if (compresso) {
        const flusso = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
        bytes = new Uint8Array(await new Response(flusso).arrayBuffer());
      }
      const c = JSON.parse(new TextDecoder().decode(bytes));
      return c && Array.isArray(c.b) && c.b.length ? c : null;
    } catch (e) { return null; }
  }

  // "Trazioni alla sbarra, orizzontali o facilitate..." → nome da dire + dettaglio da leggere
  function dividi(testo) {
    const m = testo.match(/^([^,:(]+)(.*)$/);
    return { nome: (m ? m[1] : testo).trim(), dettaglio: (m ? m[2] : '').replace(/^[\s,:]+/, '').trim() };
  }

  function passi(c) {
    const fuori = [];
    c.b.forEach((bl, bi) => {
      for (let giro = 1; giro <= bl.g; giro++) {
        const es = bl.e.filter(x => (x[3] || bl.g) >= giro);
        es.forEach((x, ei) => {
          const ultimoDelGiro = ei === es.length - 1;
          const ultimoDelBlocco = ultimoDelGiro && giro === bl.g;
          const ultimoDiTutti = ultimoDelBlocco && bi === c.b.length - 1;
          const q = String(x[1] || '');
          const numero = q.match(/\d+/);
          // il test del salto (30/09) si segna in centimetri: "cm, il migliore di tre prove"
          const u = /\bcm\b/.test(q) ? 'cm' : /second/i.test(q) ? 'sec' : 'rip';
          fuori.push(Object.assign(dividi(x[0]), {
            testo: x[0], q, sec: Number(x[2]) || 0, kg: x[4] == null ? null : Number(x[4]),
            // le ripetizioni (o i secondi) della scheda: "10 per lato" → 10, "poche ripetizioni" → null
            pr: numero && u !== 'cm' ? Number(numero[0]) : null, u,
            giro, giri: bl.g, blocco: bi + 1, blocchi: c.b.length, primoDelGiro: ei === 0,
            // un esercizio solo = serie classiche (salti, lezione); più esercizi = un circuito a giri
            unita: bl.e.length > 1 ? 'Giro' : 'Serie', pezzo: bl.e.length > 1 ? 'Blocco' : 'Esercizio',
            rec: ultimoDiTutti ? 0 : (!ultimoDelGiro ? bl.r : bl.rg) || 0, rg: bl.rg || 0,
            fatto: null,                            // {r, kg} quando tocca Fatto
          }));
        });
      }
    });
    return fuori;
  }

  function aParole(s) {
    const m = Math.floor(s / 60), r = s % 60;
    if (!m) return `${r} secondi`;
    const minuti = m === 1 ? '1 minuto' : `${m} minuti`;
    return r ? `${minuti} e ${r}` : minuti;
  }

  function orologio(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }

  const kg = x => `${String(x).replace('.', ',')} kg`;
  const pezzoGiro = p => p.giri > 1 ? `${p.unita} ${p.giro} di ${p.giri}` : '';

  const c = await leggiCircuito();
  const MODO = (c && c.m) || '';
  const LEZIONE = MODO === 'lezione';
  const CORSA = !!(c && /-corsa$/.test(c.k || ''));
  // P cambia con "+ 1 serie" e "Questa è l'ultima": sta dentro lo stato salvato (st.P)
  let P = c ? passi(c) : [];
  let st = null;               // {i, fase: 'es'|'rec'|'fine', fine, pausa, inizio, finito, P, cur, mandato}
  document.querySelectorAll('.modo').forEach(el => {
    el.textContent = { lezione: 'In lezione', serie: 'Serie' }[MODO] || 'Circuito';
  });

  function salva() {
    try { localStorage.setItem(K_STATO, JSON.stringify(Object.assign({}, st, { h: location.hash }))); } catch (e) {}
  }
  function letto() {
    try {
      const s = JSON.parse(localStorage.getItem(K_STATO));
      return s && s.h === location.hash ? s : null;
    } catch (e) { return null; }
  }
  // da riprendere: un allenamento a metà (12 ore), o finito ma non ancora mandato (3 giorni)
  function statoSalvato() {
    const s = letto();
    if (!s) return null;
    if (s.fase === 'fine') return !s.mandato && Date.now() - s.inizio < 72 * 3600e3 ? s : null;
    return s.i < (s.P || P).length && Date.now() - s.inizio < 12 * 3600e3 ? s : null;
  }

  // ================= RIPETIZIONI E PESO =================
  const registrabile = p => !CORSA && !p.sec;       // a tempo col timer: si segna da solo
  // quello che la serie propone: se già fatta i suoi numeri, se no le ripetizioni della scheda
  // (o quelle della serie prima, se la scheda non ha un numero) e il peso della serie prima
  // (o dell'ultima volta)
  function valoriDi(i) {
    const p = P[i];
    if (p.fatto) return { r: p.fatto.r, kg: p.fatto.kg };
    let prima = null;
    for (let j = i - 1; j >= 0 && !prima; j--) if (P[j].testo === p.testo && P[j].fatto) prima = P[j].fatto;
    return { r: p.pr != null ? p.pr : (prima ? prima.r : null), kg: prima ? prima.kg : p.kg };
  }
  function segnaPasso(i) {
    const p = P[i];
    if (CORSA) return;
    p.fatto = registrabile(p) ? { r: st.cur.r, kg: st.cur.kg } : { r: p.pr != null ? p.pr : p.sec, kg: null };
  }
  const numeroKg = t => {
    const x = parseFloat(String(t).replace(',', '.'));
    return x > 0 && x < 1000 ? Math.round(x * 100) / 100 : null;
  };
  const scriviKg = x => x == null ? '' : String(x).replace('.', ',');

  // "+ 1 serie": una serie in più dello stesso esercizio, subito dopo questa
  function piuSerie() {
    const i = st.i, p = P[i];
    const nuovo = Object.assign({}, p, { giro: p.giro + 1, fatto: null, rec: p.rec });
    p.rec = p.rg;                                   // tra una serie e l'altra
    P.splice(i + 1, 0, nuovo);
    P.forEach((x, j) => { if (x.blocco === p.blocco) { x.giri += 1; if (j > i + 1) x.giro += 1; } });
    salva();
    disegna();
  }
  // "Questa è l'ultima": via le serie che restano di questo esercizio
  function ultimaSerie() {
    const i = st.i, p = P[i];
    let j = i + 1;
    while (j < P.length && P[j].blocco === p.blocco) j++;
    if (j === i + 1) return;
    p.rec = P[j - 1].rec;                           // il recupero che c'era dopo l'esercizio
    P.splice(i + 1, j - i - 1);
    P.forEach(x => { if (x.blocco === p.blocco) x.giri = p.giro; });
    salva();
    disegna();
  }

  // ================= MANDA A F.R.I.D.A.Y =================
  // le serie fatte, esercizio per esercizio: [{n: testo, u: 'rip'|'sec', s: [[ripetizioni, kg]]}]
  function raccolta() {
    const m = new Map();
    P.forEach(p => {
      if (!p.fatto) return;
      if (!m.has(p.testo)) m.set(p.testo, { n: p.testo, u: p.u, s: [] });
      m.get(p.testo).s.push([p.fatto.r, p.fatto.kg]);
    });
    return [...m.values()];
  }
  // come serie_a_parole di allenamento.py: "16 kg × 8, 8 · 18 kg × 6"
  function serieAParole(serie, u) {
    const pezzi = [];
    let gruppo = [], peso;
    const chiudi = () => { if (gruppo.length) pezzi.push((peso != null ? kg(peso) + ' × ' : '') + gruppo.join(', ')); };
    serie.forEach(([r, p], i) => {
      if (i && p !== peso) { chiudi(); gruppo = []; }
      peso = p;
      gruppo.push(r == null ? '?' : u === 'sec' ? `${r}"` : u === 'cm' ? `${r} cm` : String(r));
    });
    chiudi();
    return pezzi.join(' · ');
  }
  function esitoManda(testo, bene) {
    $('esitoManda').hidden = !testo;
    $('esitoManda').textContent = testo || '';
    $('esitoManda').className = 'avviso' + (bene ? ' bene' : '');
  }
  let mandando = false, erroreManda = false;
  async function manda() {
    if (!st || st.fase !== 'fine' || mandando) return;
    mandando = true;
    erroreManda = false;
    $('manda').disabled = true;
    esitoManda('Sto mandando…');
    try {
      const r = await fetch(CASELLA, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },    // testo semplice: niente domanda preventiva del browser
        body: JSON.stringify({ v: 1, k: c.k, f: c.f, t: c.t, prova: PROVA || undefined, es: CORSA ? [] : raccolta() }),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.errore || `risposta ${r.status}`);
      if (j.prova) {
        esitoManda('PROVA: niente salvato, nessun messaggio. F.R.I.D.A.Y avrebbe scritto:\n' + j.testo, true);
      } else {
        st.mandato = Date.now();
        salva();
        esitoManda('✅ Arrivato. F.R.I.D.A.Y ti ha risposto su Telegram.', true);
      }
      $('manda').hidden = true;
    } catch (e) {
      erroreManda = true;
      esitoManda(`❌ Non partito (${e.message}). Controlla internet e riprova: le serie restano qui.`);
    }
    mandando = false;
    $('manda').disabled = false;
  }

  // ================= SUONO =================
  // Come in X Training: i bip (e la voce) sono programmati in anticipo nel motore audio, agli
  // orari giusti, così suonano puntuali anche se il telefono rallenta la pagina.
  let ctx = null, suoni = [], turno = 0;
  function audio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ctx = new AC();
    }
    if (ctx && ctx.state !== 'running') ctx.resume();
    return ctx;
  }
  function tieni(sorgente, g) {
    const s = { osc: sorgente, g };
    suoni.push(s);
    sorgente.onended = () => { g.disconnect(); suoni = suoni.filter(x => x !== s); };
  }
  function tono(quando, freq, durata, volume) {
    if (!ctx || quando < Date.now() - 50) return;
    const t = ctx.currentTime + Math.max(0, (quando - Date.now()) / 1000);
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(volume, t + 0.01);
    g.gain.setValueAtTime(volume, t + durata - 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + durata);
    osc.connect(g).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + durata + 0.05);
    tieni(osc, g);
  }
  function suonaFrase(buf, t) {
    const src = ctx.createBufferSource();
    const g = ctx.createGain();
    src.buffer = buf;
    src.connect(g).connect(ctx.destination);
    src.start(t);
    tieni(src, g);
  }
  function zittisci() {
    turno++;                                    // una frase ancora da preparare non parte più
    suoni.forEach(s => { try { s.g.disconnect(); s.osc.stop(); } catch (e) {} });
    suoni = [];
    if (window.speechSynthesis) speechSynthesis.cancel();
  }
  // 3-2-1 brevi e poi uno lungo e acuto quando il tempo è finito
  function contoAllaRovescia(fine) {
    zittisci();
    [3000, 2000, 1000].forEach(d => tono(fine - d * VEL, 880, 0.12, 0.3));
    tono(fine, 1319, 0.45, 0.35);
  }
  function vibra(schema) { if (navigator.vibrate) navigator.vibrate(schema); }

  // ================= VOCE =================
  // Frasi registrate al PC con la voce italiana di Windows (strumenti/genera-voce.js) e suonate
  // nel motore audio come i bip: così parla anche dentro Telegram, dove la voce del telefono non
  // c'è (provato il 27/09). Una frase è fatta di pezzi ("Giro 2 di 3", "Goblet squat", "8"): se
  // manca un pezzo (un esercizio nuovo non ancora registrato) prova la voce del telefono, e se
  // nemmeno quella c'è dice i pezzi registrati.
  const K_VOCE = 'circuito-voce' + (MODO ? '-' + MODO : '');
  const chiave = t => String(t).toLowerCase().replace(/[.,:;!?"()]/g, ' ').replace(/\s+/g, ' ').trim();
  let voceSi = !MODO;                           // fuori casa parte spenta: c'è il cliente, c'è gente
  try { const v = localStorage.getItem(K_VOCE); if (v) voceSi = v === 'si'; } catch (e) {}
  let indice = {};
  const scaricati = new Map(), decodificati = new Map();
  const indiceCaricato = fetch('voce/indice.json')
    .then(r => r.ok ? r.json() : {}).then(i => { indice = i || {}; }).catch(() => {});
  function scarica(k) {
    if (!scaricati.has(k)) {
      scaricati.set(k, fetch('voce/' + indice[k]).then(r => {
        if (!r.ok) throw new Error('voce ' + r.status);
        return r.arrayBuffer();
      }));
    }
    return scaricati.get(k);
  }
  function decodifica(k) {
    if (!decodificati.has(k)) decodificati.set(k, scarica(k).then(ab => ctx.decodeAudioData(ab.slice(0))));
    return decodificati.get(k);
  }
  function frasiDelCircuito() {
    const f = new Set(['Via', 'Prossimo', 'Finito, bravo', 'Riprendiamo']);
    P.forEach(p => {
      f.add(pezzoGiro(p)); f.add(p.nome); f.add(p.q);
      if (p.rec) f.add('Recupero ' + aParole(p.rec));
    });
    return [...f].filter(Boolean);
  }
  // si scaricano subito, così quando serve sono già sul telefono
  indiceCaricato.then(() => frasiDelCircuito().forEach(t => {
    const k = chiave(t);
    if (indice[k]) scarica(k).catch(() => {});
  }));

  let voceItaliana = null;
  function scegliVoce() {
    const v = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    voceItaliana = v.find(x => /^it/i.test(x.lang) && x.localService) || v.find(x => /^it/i.test(x.lang)) || null;
  }
  if ('speechSynthesis' in window) { scegliVoce(); speechSynthesis.onvoiceschanged = scegliVoce; }
  function sintesi(testo, esito) {
    const u = new SpeechSynthesisUtterance(testo);
    u.lang = 'it-IT';
    if (voceItaliana) u.voice = voceItaliana;
    if (esito) {
      u.onstart = () => esito('telefono');
      u.onerror = e => esito('errore: ' + (e.error || '?'));
    }
    // Chrome: una frase detta subito dopo cancel() a volte si perde
    setTimeout(() => { speechSynthesis.resume(); speechSynthesis.speak(u); }, 80);
  }

  // esito (solo per la prova): 'registrata', 'in parte', 'telefono', 'manca' o 'errore: …'
  async function parla(pezzi, anche, esito) {
    pezzi = pezzi.filter(Boolean);
    if ((!voceSi && !anche) || !pezzi.length) return;
    const mio = ++turno;
    await indiceCaricato;
    const chiavi = pezzi.map(chiave);
    const registrate = chiavi.filter(k => indice[k]);
    const telefono = window.speechSynthesis && speechSynthesis.getVoices().length > 0;
    if (registrate.length < chiavi.length && telefono) return sintesi(pezzi.join('. '), esito);
    if (!registrate.length || !audio()) { if (esito) esito('manca'); return; }
    try {
      const frasi = await Promise.all(registrate.map(decodifica));
      if (mio !== turno) return;                // nel frattempo è cambiato qualcosa
      let t = ctx.currentTime + 0.05;
      frasi.forEach(b => { suonaFrase(b, t); t += b.duration + 0.12; });
      if (esito) esito(registrate.length < chiavi.length ? 'in parte' : 'registrata');
    } catch (e) {
      if (telefono) sintesi(pezzi.join('. '), esito);
      else if (esito) esito('errore: ' + e.message);
    }
  }

  function provaVoce() {
    audio();
    tono(Date.now() + 3500, 1319, 0.3, 0.3);
    const scrivi = t => { $('esitoVoce').hidden = false; $('esitoVoce').textContent = t; };
    let arrivato = false;
    scrivi('Sto provando… tra poco anche un bip.');
    parla(['Ciao Simone, questa è la voce del circuito'], true, e => {
      arrivato = true;
      if (e === 'registrata') scrivi('🔊 Parte la voce registrata. Se non la senti ma senti il bip, dillo a Claude.');
      else if (e === 'telefono') scrivi('✅ Parla la voce del telefono.');
      else scrivi(`❌ Voce non partita (${e}). Dillo a Claude.`);
    });
    setTimeout(() => { if (!arrivato) scrivi('❌ La voce non si è caricata (serve internet la prima volta). Dillo a Claude.'); }, 4000);
  }
  function mostraVoce() {
    $('voce1').textContent = voceSi ? '🔊 Voce sì' : '🔇 Voce no';
    $('voce2').textContent = voceSi ? '🔊' : '🔇';
  }
  function cambiaVoce() {
    voceSi = !voceSi;
    try { localStorage.setItem(K_VOCE, voceSi ? 'si' : 'no'); } catch (e) {}
    if (!voceSi) zittisci();
    mostraVoce();
  }

  // ================= SCHERMO SEMPRE ACCESO =================
  let wakeLock = null, vuoleSchermo = false, chiedendo = false;
  async function schermoAcceso() {
    vuoleSchermo = true;
    if (!('wakeLock' in navigator) || wakeLock || chiedendo || document.visibilityState !== 'visible') return;
    chiedendo = true;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (e) {}
    chiedendo = false;
  }
  function rilasciaSchermo() {
    vuoleSchermo = false;
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && vuoleSchermo) schermoAcceso();
  });

  // ================= IL GIRO =================
  function vai(i, riprendi) {               // comincia l'esercizio i (riprendi: tiene i numeri già toccati)
    const p = P[i];
    st.i = i; st.fase = 'es'; st.pausa = null;
    st.fine = p.sec ? Date.now() + p.sec * 1000 * VEL : null;
    if (!(riprendi && st.cur)) st.cur = valoriDi(i);
    salva();
    zittisci();
    if (st.fine) contoAllaRovescia(st.fine);
    parla([p.primoDelGiro && pezzoGiro(p), p.nome, p.q, p.sec && 'Via']);
    vibra(150);
    disegna();
  }

  function finito() {                       // tasto Fatto, o fine del tempo
    const p = P[st.i];
    segnaPasso(st.i);
    if (st.i >= P.length - 1) return fine();
    if (p.rec > 0) {
      st.fase = 'rec'; st.pausa = null;
      st.fine = Date.now() + p.rec * 1000 * VEL;
      salva();
      contoAllaRovescia(st.fine);
      const n = P[st.i + 1];
      parla(['Recupero ' + aParole(p.rec), 'Prossimo', n.nome, n.q]);
      disegna();
    } else {
      vai(st.i + 1);                        // corsa → camminata, o la serie dopo in lezione
    }
  }

  function fine() {
    st.fase = 'fine'; st.fine = null; st.pausa = null; st.finito = Date.now();
    salva();
    zittisci();
    [0, 180, 360].forEach(d => tono(Date.now() + 60 + d, 1047 + d, 0.2, 0.3));
    parla(['Finito, bravo']);
    vibra([200, 100, 200]);
    rilasciaSchermo();
    disegna();
  }

  function pausa() {
    if (!st || !st.fine) return;
    if (st.pausa == null) {
      st.pausa = st.fine - Date.now();
      zittisci();
    } else {
      st.fine = Date.now() + st.pausa;
      st.pausa = null;
      contoAllaRovescia(st.fine);
    }
    salva();
    disegna();
  }

  function comincia(salvato) {
    if (salvato && salvato.fase === 'fine') {   // finito ma non mandato: si torna alla fine
      st = salvato;
      P = st.P || P;
      return disegna();
    }
    audio();
    schermoAcceso();
    if (salvato) {
      st = salvato;
      if (st.P) P = st.P; else st.P = P;        // uno stato di prima del 30/09 non ha P
      if (st.fase === 'rec') {
        const resta = st.pausa != null ? st.pausa : st.fine - Date.now();
        if (resta > 0) {
          st.fine = Date.now() + resta; st.pausa = null;
          salva(); contoAllaRovescia(st.fine);
          parla(['Riprendiamo']);
          return disegna();
        }
        return vai(st.i + 1);
      }
      return vai(st.i, true);               // l'esercizio interrotto si rifà
    }
    P = passi(c);
    st = { i: 0, fase: 'es', fine: null, pausa: null, inizio: Date.now(), P };
    vai(0);
  }

  // ================= DISEGNO =================
  const SCHERMI = ['scVuoto', 'scInizio', 'scGiro', 'scFine'];
  function mostra(nome) { SCHERMI.forEach(id => { $(id).hidden = id !== nome; }); }

  function disegnaInizio() {
    $('titolo').textContent = c.t || 'Allenamento';
    if (LEZIONE) {
      $('durata').textContent = `${P.length} serie, una dopo l'altra · il recupero lo decide la lezione`;
    } else {
      const secondi = P.reduce((tot, p) => tot + (p.sec || 40) + p.rec, 0);   // a ripetizioni: circa 40"
      $('durata').textContent = `${P.length} ${MODO ? 'serie' : 'esercizi da fare'} · circa ${Math.max(1, Math.round(secondi / 60))} minuti`;
    }
    const box = $('blocchi');
    box.textContent = '';
    c.b.forEach((b, bi) => {
      const d = document.createElement('div');
      d.className = 'blocco';
      const h = document.createElement('h3');
      const giri = b.e.length > 1 ? (b.g > 1 ? `${b.g} giri` : '1 giro') : (b.g > 1 ? `${b.g} serie` : '1 serie');
      h.textContent = (c.b.length > 1 ? `${b.e.length > 1 ? 'Blocco' : 'Esercizio'} ${bi + 1} · ` : '') + giri;
      const recuperi = document.createElement('p');
      recuperi.textContent = LEZIONE ? 'recupero: quando la lezione lo permette'
        : [b.e.length > 1 && b.r ? `${b.r}" tra un esercizio e l'altro` : '',
           b.rg ? `${b.rg}" di recupero ${b.e.length > 1 ? 'tra i giri' : 'tra le serie'}` : '']
          .filter(Boolean).join(' · ') || 'senza recuperi';
      const ol = document.createElement('ol');
      b.e.forEach(x => {
        const li = document.createElement('li');
        li.append(dividi(x[0]).nome + ' — ');
        const q = document.createElement('b');
        q.textContent = x[1];
        li.append(q);
        if (x[4] != null) {
          const u = document.createElement('span');
          u.textContent = ` · ultima volta ${kg(x[4])}`;
          li.append(u);
        }
        ol.append(li);
      });
      d.append(h, recuperi, ol);
      box.append(d);
    });
    const salvato = statoSalvato();
    $('riprendi').hidden = !salvato;
    $('via').textContent = salvato ? 'Ricomincia da capo' : (LEZIONE ? '▶️ Inizia' : '▶️ Via');
    $('via').className = salvato ? 'grande secondo' : 'grande';
    if (salvato && salvato.fase === 'fine') {
      $('riprendi').textContent = '📤 Finito e non mandato: mandalo a F.R.I.D.A.Y';
    } else if (salvato) {
      const p = (salvato.P || P)[salvato.i];
      $('riprendi').textContent = `▶️ Riprendi: ${p.nome}` + (p.giri > 1 ? ` (${p.unita.toLowerCase()} ${p.giro} di ${p.giri})` : '');
    }
    const vecchio = letto();
    const mandato = vecchio && vecchio.mandato ? new Date(vecchio.mandato) : null;
    $('giaMandato').hidden = !mandato;
    if (mandato) {
      $('giaMandato').textContent = `✅ Già mandato a F.R.I.D.A.Y alle ${mandato.getHours()}:${String(mandato.getMinutes()).padStart(2, '0')}. `
        + "Se lo rifai e lo rimandi, vale l'ultimo.";
    }
  }

  function disegna() {
    mostraVoce();
    if (!c) return mostra('scVuoto');
    if (!st) { disegnaInizio(); return mostra('scInizio'); }
    if (st.fase === 'fine') {
      const minuti = Math.max(1, Math.round((st.finito - st.inizio) / 60000));
      $('fineTempo').textContent = minuti === 1 ? '1 minuto' : `${minuti} minuti`;
      $('fineTitolo').textContent = c.t || '';
      const fatti = CORSA ? [] : raccolta();
      const box = $('fineRiepilogo');
      box.textContent = '';
      box.hidden = !fatti.length;
      if (fatti.length) {
        const ol = document.createElement('ol');
        ol.className = 'riepilogo';
        fatti.forEach(e => {
          const li = document.createElement('li');
          li.append(dividi(e.n).nome + ': ');
          const b = document.createElement('b');
          b.textContent = serieAParole(e.s, e.u);
          li.append(b);
          ol.append(li);
        });
        box.append(ol);
      }
      if (st.mandato) {
        $('manda').hidden = true;
        esitoManda('✅ Arrivato. F.R.I.D.A.Y ti ha risposto su Telegram.', true);
      } else if (!c.f) {                        // link di prima del 30/09: la casella non lo accetta
        $('manda').hidden = true;
        esitoManda('Questo link è di prima: tocca ✅ fatto nel promemoria di F.R.I.D.A.Y.');
      } else if (!mandando) {
        $('manda').hidden = false;
        if (!erroreManda) esitoManda('');
      }
      return mostra('scFine');
    }
    mostra('scGiro');
    const p = P[st.i];
    const n = P[st.i + 1];
    const rec = st.fase === 'rec';
    $('contatore').textContent = `${st.i + 1} di ${P.length}`;
    $('barraProgresso').style.width = `${Math.round(((st.i + (rec ? 1 : 0)) / P.length) * 100)}%`;
    const giro = rec ? n : p;
    $('chip').textContent = (giro.giri > 1 ? `${giro.unita} ${giro.giro} di ${giro.giri}` : `${giro.unita} unic${giro.unita === 'Giro' ? 'o' : 'a'}`).toUpperCase()
      + (giro.blocchi > 1 ? ` · ${giro.pezzo} ${giro.blocco} di ${giro.blocchi}`.toUpperCase() : '');
    $('vistaEs').hidden = rec;
    $('vistaRec').hidden = !rec;
    $('fatto').hidden = rec;
    $('salta').hidden = !rec;
    $('pausa').hidden = !st.fine;
    $('pausa').textContent = st.pausa != null ? '▶️ Riprendi' : '⏸ Pausa';
    $('avvisoPausa').hidden = st.pausa == null;
    $('indietro').hidden = !rec && st.i === 0;
    if (!rec) {
      $('esNome').textContent = p.nome;
      $('esQuanto').textContent = p.q;
      $('esPeso').hidden = p.kg == null;
      $('esPeso').textContent = p.kg == null ? '' : `ultima volta ${kg(p.kg)}`;
      $('esDettaglio').textContent = p.dettaglio;
      $('esTempo').hidden = !p.sec;
      $('registra').hidden = !registrabile(p);
      if (registrabile(p)) {
        $('rEtichetta').textContent = { sec: 'Secondi', cm: 'Centimetri' }[p.u] || 'Ripetizioni';
        $('kgEtichetta').parentElement.hidden = p.u === 'cm';     // il test non ha peso
        $('rMeno').hidden = $('rPiu').hidden = p.u === 'cm';      // i centimetri si scrivono
        if (document.activeElement !== $('rValore')) $('rValore').value = st.cur.r == null ? '' : st.cur.r;
        if (document.activeElement !== $('kgValore')) $('kgValore').value = scriviKg(st.cur.kg);
      }
      const classiche = registrabile(p) && p.unita === 'Serie' && p.u !== 'cm';   // il test si fa una volta
      $('rigaSerie').hidden = !classiche;
      $('ultimaSerie').hidden = !(classiche && n && n.blocco === p.blocco);
      // in lezione non c'è la schermata del recupero: il "dopo" si vede qui
      $('esPoi').hidden = !(LEZIONE && n);
      $('esPoi').textContent = LEZIONE && n ? `Dopo: ${n.nome} — ${n.q}` + (n.giri > 1 ? ` (serie ${n.giro} di ${n.giri})` : '') : '';
    } else {
      $('recProssimo').textContent = '';
      $('recProssimo').append(n.nome + (n.q ? ' — ' : ''));
      if (n.q) {
        const b = document.createElement('b');
        b.textContent = n.q;
        $('recProssimo').append(b);
      }
      if (n.kg != null) $('recProssimo').append(` · ${kg(n.kg)}`);
    }
    aggiornaTempi();
  }

  function aggiornaTempi() {
    if (!st || !st.fine) return;
    const resta = st.pausa != null ? st.pausa : st.fine - Date.now();
    $(st.fase === 'rec' ? 'recTempo' : 'esTempo').textContent = orologio(resta);
  }

  setInterval(() => {
    if (!st || st.fase === 'fine' || !st.fine || st.pausa != null) return;
    if (Date.now() >= st.fine) {
      if (st.fase === 'es') finito();
      else vai(st.i + 1);
    } else {
      aggiornaTempi();
    }
  }, 200);

  // ================= TASTI =================
  $('via').onclick = () => { try { localStorage.removeItem(K_STATO); } catch (e) {} comincia(null); };
  $('riprendi').onclick = () => comincia(statoSalvato());
  $('provaVoce').onclick = provaVoce;
  $('voce1').onclick = cambiaVoce;
  $('voce2').onclick = cambiaVoce;
  $('fatto').onclick = () => { if (st && st.fase === 'es') finito(); };
  $('salta').onclick = () => { if (st && st.fase === 'rec') vai(st.i + 1); };
  $('pausa').onclick = pausa;
  $('indietro').onclick = () => {
    if (!st) return;
    if (st.fase === 'rec') vai(st.i);        // rifai l'esercizio appena segnato
    else if (st.i > 0) vai(st.i - 1);
  };
  $('termina').onclick = () => { if (confirm('Terminare adesso?')) fine(); };
  $('daCapo').onclick = () => {
    if (st && !st.mandato && raccolta().length && !confirm('Le serie segnate non sono state mandate. Cancellarle?')) return;
    st = null;
    erroreManda = false;
    try { localStorage.removeItem(K_STATO); } catch (e) {}
    esitoManda('');
    disegna();
  };
  $('manda').onclick = manda;
  $('piuSerie').onclick = () => { if (st && st.fase === 'es') piuSerie(); };
  $('ultimaSerie').onclick = () => { if (st && st.fase === 'es') ultimaSerie(); };
  const passo = () => P[st.i].u === 'sec' ? 5 : 1;
  $('rMeno').onclick = () => {
    if (!st || st.fase !== 'es' || st.cur.r == null) return;
    st.cur.r = Math.max(0, st.cur.r - passo());
    salva(); disegna();
  };
  $('rPiu').onclick = () => {
    if (!st || st.fase !== 'es') return;
    st.cur.r = st.cur.r == null ? passo() : Math.min(999, st.cur.r + passo());
    salva(); disegna();
  };
  $('rValore').oninput = () => {
    const x = parseInt($('rValore').value, 10);
    st.cur.r = x >= 0 && x < 1000 ? x : null;
    salva();
  };
  $('kgValore').oninput = () => { st.cur.kg = numeroKg($('kgValore').value); salva(); };
  ['rValore', 'kgValore'].forEach(id => {
    $(id).onkeydown = ev => { if (ev.key === 'Enter') $(id).blur(); };
    $(id).onblur = () => { if (st && st.fase === 'es') disegna(); };   // riscrive il numero come l'ha capito
  });
  window.addEventListener('hashchange', () => location.reload());

  window.circuito = { get passi() { return P; }, stato: () => st, frasi: frasiDelCircuito, chiave, raccolta };   // per le prove automatiche
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});   // anche senza rete
  disegna();
})();
</script>
</body>
</html>
